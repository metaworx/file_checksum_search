openapi: "3.0.3"
info:
  title: FCIAS Public API
  description: |
    Public REST API for the File Checksum Index & Search (FCIAS) Nextcloud app.
    
    Provides hash lookup, duplicate detection, hash recalculation, and status endpoints.
    All endpoints require authentication via NC session cookie, HTTP Basic Auth, or Bearer token.
    
    See [docs/api-v1.md](docs/api-v1.md) for the PHP API and full documentation.
  version: "1.0.0"
  contact:
    name: metaworx
    url: https://gitlab.com/metaworx/open-source/nextcloud/file_checksum_search

servers:
  - url: https://nc.example.com/ocs/v2.php/apps/file_checksum_search
    description: Typical Nextcloud instance (replace hostname)

security:
  - basicAuth: []
  - bearerAuth: []
  - cookieAuth: []

paths:
  /api/v1/lookup:
    get:
      tags: [Lookup]
      summary: Search files by hash value
      description: Find all files whose checksum matches the given hash. Optionally filter by algorithm.
      operationId: findByHash
      parameters:
        - name: hash
          in: query
          required: true
          description: Hex-encoded hash value (32, 40, 64, or 128 characters depending on algorithm)
          schema:
            type: string
            minLength: 8
            example: "da39a3ee5e6b4b0d3255bfef95601890afd80709"
        - name: algo
          in: query
          required: false
          description: Algorithm filter
          schema:
            type: string
            description: "Any name GET /api/v1/algorithms lists for this instance. The set is configured, not fixed; the shipped default is sha1, md5, adler32, crc32, sha256, sha384, sha512, sha3-256, sha3-384 and sha3-512."
            example: sha1
        - name: limit
          in: query
          required: false
          description: Maximum results (1–500, default 100)
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HashLookupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/file/{fileId}/hashes:
    get:
      tags: [Lookup]
      summary: Get all checksums for a file
      description: Retrieve all computed checksums for a file by its filecache ID.
      operationId: getHashesByFileId
      parameters:
        - name: fileId
          in: path
          required: true
          description: The filecache file ID
          schema:
            type: integer
            example: 12345
      responses:
        "200":
          description: File hashes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileHashesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/file/{fileId}/duplicates:
    get:
      tags: [Lookup]
      summary: Find files sharing hash values with a given file
      description: For each algorithm for which the given file has a checksum, find other files with the same hash value.
      operationId: findSameHash
      parameters:
        - name: fileId
          in: path
          required: true
          description: The filecache file ID of the reference file
          schema:
            type: integer
            example: 12345
      responses:
        "200":
          description: Same-hash file groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SameHashResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/file/{fileId}/recalc:
    post:
      tags: [Lookup]
      summary: Recalculate hash for a file
      description: >-
        Trigger checksum recalculation for a file. Reads the file content and recomputes the hash.
        Refused with 403 when an `exclude` rule covers the file, or when the account may not
        calculate by hand (the *manual_recalc* permission; members of `admin` always may).
      operationId: recalcHash
      parameters:
        - name: fileId
          in: path
          required: true
          description: The filecache file ID
          schema:
            type: integer
            example: 12345
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                algo:
                  type: string
                  description: "Any name GET /api/v1/algorithms lists for this instance. The set is configured, not fixed; the shipped default is sha1, md5, adler32, crc32, sha256, sha384, sha512, sha3-256, sha3-384 and sha3-512."
                  default: sha1
                  example: sha256
      responses:
        "200":
          description: Recalculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecalcResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/HashingExcluded"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/file/many/recalc:
    post:
      tags: [Lookup]
      summary: Recalculate several files in one request
      description: >-
        One gesture, one request. Each file goes through the same checks as
        `/api/v1/file/{fileId}/recalc`, so a file that is not the caller's or
        that a rule excludes fails on its own row and the others still go
        through; the refusals that are 403 on the single route are plain rows
        here, with the same `excluded`/`ruleId`/`forbidden` markers. The request
        stops at 25 files or 100 MiB of filecache size, whichever comes first —
        the first file always goes through, however large — and returns the ids
        it did not get to as `remaining`, in the order given; send those again.
        `many` is a literal where `{fileId}` stands on the route beside it.
      operationId: recalcMany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecalcManyInput"
      responses:
        "200":
          description: One result per file processed, and the ids not reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecalcManyResponse"
        "400":
          description: "`fileIds` missing, empty, or not a list of integers"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/duplicates:
    get:
      tags: [Duplicates]
      summary: Find all duplicate hash groups
      description: Find groups of files that share the same hash value. Supports filtering by algorithm, pagination, and minimum group size.
      operationId: findDuplicates
      parameters:
        - name: algo
          in: query
          required: false
          description: Algorithm filter
          schema:
            type: string
            description: "Any name GET /api/v1/algorithms lists for this instance. The set is configured, not fixed; the shipped default is sha1, md5, adler32, crc32, sha256, sha384, sha512, sha3-256, sha3-384 and sha3-512."
            example: sha1
        - name: minCount
          in: query
          required: false
          description: Minimum files per duplicate group (default 2)
          schema:
            type: integer
            minimum: 2
            default: 2
        - name: limit
          in: query
          required: false
          description: Maximum groups to return (1–500, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          description: Pagination offset (default 0)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: hash
          in: query
          required: false
          description: >-
            Keep only groups whose checksum this names — whole values first, then those beginning
            with it. Case is ignored. A term longer than the index column's 63 characters is
            compared there on its first 63 and matched against the metadata document as well, so a
            full SHA-512 finds exactly its group.
          schema:
            type: string
            example: 0beec7b5ea3f0fdbc95d0dd47f3c5bc275da8a33
        - name: anywhere
          in: query
          required: false
          description: Match the term anywhere in the hash rather than only at its start
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Duplicate groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatesResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/sudo/file/{fileId}/recalc:
    post:
      tags: [Sudo]
      summary: Recalculate the hash of a file that need not be your own
      description: >-
        The cross-account twin of `/api/v1/file/{fileId}/recalc`, and the only
        cross-account route that writes. Requires a password confirmed within the
        last thirty minutes, or a granted app password (403 with "Password
        confirmation required" otherwise), and 403 "Not yours to look at." when
        the file is out of the caller's reach: a member of `admin`, or anyone the
        `instance_view` permission names, reaches any file; a sub-admin reaches a
        file held by an account in one of the groups they administer.
        Reaching a file is not permission to recalculate it. The *manual_recalc*
        permission is answered against whoever is asking — never against the
        file's owner — and an `exclude` rule still refuses the path, which is
        what keeps this from reading storage that costs money. The call is
        logged at info level naming the acting account.
      operationId: sudoRecalcHash
      parameters:
        - name: fileId
          in: path
          required: true
          description: The filecache file ID, of any account the caller may reach
          schema:
            type: integer
            example: 12345
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                algo:
                  type: string
                  description: "Any name GET /api/v1/algorithms lists for this instance."
                  default: sha1
                  example: sha256
      responses:
        "200":
          description: As the ordinary route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecalcResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/sudo/file/many/recalc:
    post:
      tags: [Sudo]
      summary: Recalculate several files across the caller's reach
      description: >-
        The cross-account twin of `/api/v1/file/many/recalc`: the same body, the
        same answer, the same caps. The reach is decided per file — a member of
        `admin` or anyone the `instance_view` permission names reaches every
        file, a sub-admin the files held by the members of the groups they
        administer — and a file out of reach is a `File not found.` row of its
        own rather than a refusal of the whole batch, since a group on the
        Others tab can hold several accounts' copies. Requires a password
        confirmed within the last thirty minutes, or a granted app password
        (403 with "Password confirmation required" otherwise), and is 403 for
        anyone who may not look across accounts. The *manual_recalc* permission
        and any `exclude` rule apply as on the single route. Logged at info
        level naming the acting account.
      operationId: sudoRecalcMany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecalcManyInput"
      responses:
        "200":
          description: As the ordinary route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecalcManyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/sudo/file/{fileId}/hashes:
    get:
      tags: [Sudo]
      summary: Get all checksums for any file in the caller's reach
      description: >-
        The cross-account twin of `/api/v1/file/{fileId}/hashes`. Requires a password confirmed within the last thirty minutes, or a granted app password (403 with
        "Password confirmation required" otherwise), and is refused with 403 for
        anyone who may not look across accounts: a member of `admin` or anyone the
        `instance_view` permission names reaches every file; a sub-admin reaches
        the files held by the members of the groups they administer, and a file
        outside that is 403 "Not yours to look at.".
      operationId: sudoGetHashesByFileId
      parameters:
        - name: fileId
          in: path
          required: true
          description: The filecache file ID, of any account
          schema:
            type: integer
            example: 12345
      responses:
        "200":
          description: As the ordinary route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileHashesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/sudo/file/{fileId}/duplicates:
    get:
      tags: [Sudo]
      summary: Files across the caller's reach sharing a file's hash
      description: >-
        The cross-account twin of `/api/v1/file/{fileId}/duplicates`: the reference file may be any file in the caller's reach, and the duplicates are drawn from the whole reach — every account for a member of `admin` or anyone the `instance_view` permission names, the files held by their groups' members for a sub-admin. Each row says whose file it is (`owner`, `location`) and whether the caller could open it (`openable`). Requires a password confirmed within the last thirty minutes, or a granted app password (403 with
        "Password confirmation required" otherwise), and is refused with 403 for
        anyone who may not look across accounts, or for a reference file outside
        the reach ("Not yours to look at.").
      operationId: sudoFindDuplicatesForFile
      parameters:
        - name: fileId
          in: path
          required: true
          description: The filecache file ID, of any account
          schema:
            type: integer
            example: 12345
      responses:
        "200":
          description: As the ordinary route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SameHashResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/sudo/lookup:
    get:
      tags: [Sudo]
      summary: Search the caller's whole reach by hash
      description: >-
        The cross-account twin of `/api/v1/lookup`: every account for a member of `admin` or anyone the `instance_view` permission names, the files held by their groups' members for a sub-admin. Each row says whose file it is (`owner`, `location`) and whether the caller could open it (`openable`). Requires a password confirmed within the last thirty minutes, or a granted app password (403 with
        "Password confirmation required" otherwise), and is refused with 403 for
        anyone who may not look across accounts.
      operationId: sudoLookupByHash
      parameters:
        - name: hash
          in: query
          required: true
          description: Hex-encoded hash value
          schema:
            type: string
        - name: algo
          in: query
          required: false
          description: Algorithm filter
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Max results (1–500)
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: As the ordinary route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HashLookupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/sudo/selectable:
    get:
      tags: [Sudo]
      summary: Which groups and accounts the caller may name
      description: >-
        The companion to the cross-account routes: before asking for someone's duplicates, a caller
        has to know whom it may ask about. A member of `admin`, or anyone the `instance_view`
        permission names, may name anyone; a sub-admin only the groups they administer and those
        groups' members; anyone else may name nobody and is refused with 403. `prefill` false means
        there are more than a picker holds at once, so the caller should come back with `search` as
        the user types; the threshold is an instance setting (admin settings, Advanced).
      operationId: sudoSelectable
      parameters:
        - name: search
          in: query
          required: false
          description: Narrow the offered groups and accounts as the user types
          schema:
            type: string
      responses:
        "200":
          description: What may be named
          content:
            application/json:
              schema:
                type: object
                properties:
                  prefill:
                    type: boolean
                    description: Whether the lists below are complete
                  all:
                    type: boolean
                    description: >-
                      Whether the caller may ask for their whole reach at once by naming nothing —
                      true for everyone this route answers at all.
                  reach:
                    type: string
                    enum: [everyone, groups]
                    description: >-
                      Whose reach that is: every account for a member of `admin` or anyone the
                      `instance_view` permission names, the members of the groups they administer
                      for a sub-admin. The picker labels the option *All accounts* or *All my
                      groups* from this.
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        label: {type: string}
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        label: {type: string}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller may name nobody
  /api/v1/sudo/duplicates:
    get:
      tags: [Sudo]
      summary: Duplicate groups across accounts
      description: >-
        The cross-account twin of `/api/v1/duplicates`. With `users[]`/`groups[]`, the named accounts
        and the members of the named groups as one merged listing; with neither, the caller's whole
        reach — every account for a sudoer, their groups' members for a sub-admin. Groups are expanded
        server-side, never by the client, and one target the caller may not read refuses the whole
        request rather than narrowing it. Each row says whose file it is (`owner`, `location`) and
        whether the caller could open it (`openable`). Requires a password confirmed within the last thirty
        minutes, or a granted app password (403 with "Password confirmation required" otherwise), and
        is refused with 403 for anyone who may not look across accounts: a member of `admin` or anyone
        the `instance_view` permission names may; a sub-admin may name members of their own groups,
        and their own groups.
      operationId: sudoFindAllDuplicates
      parameters:
        - name: users[]
          in: query
          required: false
          description: Accounts to list together, merged into one listing
          schema:
            type: array
            items:
              type: string
        - name: groups[]
          in: query
          required: false
          description: Groups whose members to list, expanded and authorised server-side
          schema:
            type: array
            items:
              type: string
        - name: algo
          in: query
          required: false
          description: Algorithm filter
          schema:
            type: string
        - name: minCount
          in: query
          required: false
          description: Minimum files per group
          schema:
            type: integer
            default: 2
        - name: limit
          in: query
          required: false
          description: Max groups (1–500)
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          description: Pagination offset
          schema:
            type: integer
            default: 0
        - name: hash
          in: query
          required: false
          description: As on the ordinary route — keep only groups whose checksum this names
          schema:
            type: string
        - name: anywhere
          in: query
          required: false
          description: Match the term anywhere in the hash rather than only at its start
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: As the ordinary route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/status:
    get:
      tags: [Maintenance]
      summary: App and database status
      description: Read-only health snapshot — app version, database version, indexed row count, and pending update count.
      operationId: getStatus
      responses:
        "200":
          description: Status information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/algorithms:
    get:
      tags: [status]
      summary: The algorithms this instance computes, and its default
      description: >-
        What this server's PHP offers, narrowed to what the administrator has
        allowed. Every `algo` parameter in this API accepts exactly these names.
        Names are restricted to `[a-z0-9-]+` because they double as metadata
        keys. Not fixed: ask, and cache per session.
      operationId: getAlgorithms
      responses:
        "200":
          description: The catalogue in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlgorithmsResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/preferences/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          enum: [preferred_algorithm]
        description: "The namespace was reserved for per-user preferences; preferred_algorithm is its first key."
    get:
      tags: [preferences]
      summary: One of the caller's own preferences
      operationId: getPreference
      responses:
        "200":
          description: The stored value, the instance default, and which applies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [preferences]
      summary: Set one of the caller's own preferences
      description: "An empty value returns to the instance default. For preferred_algorithm the value must be an algorithm GET /api/v1/algorithms lists."
      operationId: setPreference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  example: sha256
      responses:
        "200":
          description: The preference after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/rules:
    get:
      operationId: listRules
      summary: List hash-generation rules
      description: >-
        Rules are returned in evaluation order — first match decides. `scope`
        selects a view, not a permission: `own` lists the rules concerning the
        caller's own files and marks only their own editable, `all` is the
        administrator's whole-instance view. An administrator asking for `own`
        gets the personal view, which is what lets the personal settings page
        stay personal for everyone.
      tags: [rules]
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [own, all]
            default: own
      responses:
        "200":
          description: The rules visible in the requested view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createRule
      summary: Create a rule
      description: >-
        From a non-administrator, `selector` is forced to `home:<caller>` and
        `admin_enforced` to false whatever the payload says. A
        non-administrator must also have write access to the path on their own
        home storage: a path leading into a received share, a group folder or
        another mounted storage is refused, since such a rule could never
        match.
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: The stored rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/rules/order:
    put:
      operationId: reorderRuleSegment
      summary: Reorder one segment partition
      description: >-
        A reorder addresses all rules sharing one `selector`, split by whether
        their path is a bare catch-all (`defaults`). `orderedIds` must be
        exactly a permutation of that partition's rule IDs — never a partial
        order, which would silently drop rules from evaluation, and never a mix
        of the two partitions, which would let a rule cross the defaults
        boundary. Rules addressing different things never compete for a file, so
        a reorder cannot change which rule wins across segments. A
        non-administrator is always forced to their own segment.
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleOrderInput"
      responses:
        "200":
          description: The partition was reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/rules/{id}/apply:
    post:
      tags: [Rules]
      summary: Queue a full apply pass for one rule
      description: >-
        Marks every file the rule currently governs for background hashing, uncapped.
        Enqueues a one-shot background job and returns immediately; the outcome appears in the
        server's audit log. Applying is judged as writing the rule. Refused at submission time
        for a disabled or non-include rule.
      operationId: applyRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{32}$"
      responses:
        "200":
          description: The apply pass was queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  queued:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller may not change this rule
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]{32}$"
    put:
      operationId: updateRule
      summary: Update a rule
      description: >-
        Enabling or disabling a rule is an update of `enabled` — there is no
        separate toggle endpoint. Omitted fields keep their stored values, so a
        minimal body is complete and safe. Changing `selector` or
        `admin_enforced` moves the rule to the end of its new band, since
        position has no meaning across bands.
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: The stored rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteRule
      summary: Delete a rule
      description: >-
        Any rule the caller may mutate can be deleted, the two shipped defaults
        included: a repair step recreates a missing one, disabled, so deleting
        one is reversible housekeeping.
      tags: [rules]
      responses:
        "200":
          description: The rule was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Nextcloud app password as password, username as username
    bearerAuth:
      type: http
      scheme: bearer
      description: Nextcloud app password or OAuth token
    cookieAuth:
      type: apiKey
      in: cookie
      name: nc_session_id
      description: Nextcloud session cookie (for browser-based access)

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "Hash parameter is required."

    HashLookupResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/HashLookupResult"

    HashLookupResult:
      type: object
      required: [fileid, algo, hash, path, name]
      properties:
        fileid:
          type: integer
          example: 12345
        algo:
          type: string
          example: sha1
        hash:
          type: string
          example: "da39a3ee5e6b4b0d3255bfef95601890afd80709"
        path:
          type: string
          description: One account's name for the file's folder — with several accounts in reach, whichever opened it first.
          example: "Documents"
        name:
          type: string
          example: "report.pdf"
        owner:
          type: string
          nullable: true
          description: The owning account; null for a storage no account owns.
          example: alice
        location:
          type: string
          description: "The file's own place: `/<owner>/files/…` for a home, `groupfolder:<id>/…` for a group folder, `storage:<id>/…` otherwise."
          example: "/alice/files/Documents/report.pdf"
        openable:
          type: boolean
          description: >-
            Cross-account routes only: whether the caller's own mounts hold this file, so a
            Files-app link to it would open. Absent on the ordinary routes, where every row
            is the caller's to open.
          example: false

    FileHashesResponse:
      type: object
      required: [fileid, hashes, algos, preferred, default]
      properties:
        fileid:
          type: integer
          example: 12345
        hashes:
          type: array
          items:
            $ref: "#/components/schemas/HashEntry"
        algos:
          type: array
          items:
            type: string
          description: "The algorithms the file's governing include rule computes; empty when no rule maintains the file."
          example: [sha256, sha1]
        preferred:
          type: string
          description: "The asking user's stored preferred algorithm, if it is in force; empty otherwise."
          example: sha256
        default:
          type: string
          description: "The instance default, used when no algorithm is named."
          example: sha1
        canRecalc:
          type: boolean
          description: "Whether the asking account may calculate by hand (the *manual_recalc* permission); the sidebar hides its Recalculate buttons when false."
          example: true
        canSudo:
          type: boolean
          description: "Whether the asking account may look across accounts; the sidebar offers the way to the Duplicates page's Others tab when true."
          example: false

    PreferenceResponse:
      type: object
      required: [key, value, default, active]
      properties:
        key:
          type: string
          example: preferred_algorithm
        value:
          type: string
          description: What the user stored; empty when nothing.
          example: sha256
        default:
          type: string
          description: The instance default.
          example: sha1
        active:
          type: string
          description: Which of the two applies — the preference where it is still in force, else the default.
          example: sha256
    AlgorithmsResponse:
      type: object
      required: [algorithms, default]
      properties:
        algorithms:
          type: array
          items:
            type: string
          example: [sha1, md5, adler32, crc32, sha256, sha384, sha512, sha3-256, sha3-384, sha3-512]
        default:
          type: string
          description: Used when no algorithm is named. Designated by the administrator; the first allowed when none is.
          example: sha1
    HashEntry:
      type: object
      required: [algo, hash]
      properties:
        algo:
          type: string
          example: sha1
        hash:
          type: string
          example: "da39a3ee5e6b4b0d3255bfef95601890afd80709"
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the stored hashes were last written, from the freshness
            stamp. Null where the file carries hashes but no stamp — the
            state `occ fcias:repair --step unindexed-hashes` exists to
            correct.
          example: "2026-09-02T15:17:00+00:00"

    SameHashResponse:
      type: object
      required: [duplicates]
      properties:
        duplicates:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateGroup"

    DuplicatesResponse:
      type: object
      required: [duplicates, total_groups, pagination]
      properties:
        duplicates:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateGroup"
        total_groups:
          type: integer
          example: 1
        pagination:
          $ref: "#/components/schemas/Pagination"
        canSudo:
          type: boolean
          description: "On the ordinary listing: whether the caller may look across accounts at all — whether the Duplicates page shows its Others tab."
          example: false

    DuplicateGroup:
      type: object
      required: [algo, hash_value, file_count, files]
      properties:
        algo:
          type: string
          example: sha1
        hash_value:
          type: string
          example: "da39a3ee5e6b4b0d3255bfef95601890afd80709"
        file_count:
          type: integer
          example: 3
        files:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateFile"

    DuplicateFile:
      type: object
      required: [fileid, path, name]
      properties:
        fileid:
          type: integer
          example: 100
        path:
          type: string
          description: One account's name for the file's folder — with several accounts in reach, whichever opened it first.
          example: "Documents"
        name:
          type: string
          example: "a.pdf"
        owner:
          type: string
          nullable: true
          description: The owning account; null for a storage no account owns.
          example: alice
        location:
          type: string
          description: "The file's own place: `/<owner>/files/…` for a home, `groupfolder:<id>/…` for a group folder, `storage:<id>/…` otherwise."
          example: "/alice/files/Documents/a.pdf"
        openable:
          type: boolean
          description: >-
            Cross-account routes only: whether the caller's own mounts hold this file, so a
            Files-app link to it would open. Absent on the ordinary routes, where every row
            is the caller's to open.
          example: false

    Pagination:
      type: object
      required: [offset, limit]
      properties:
        offset:
          type: integer
          example: 0
        limit:
          type: integer
          example: 50

    RecalcResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        algo:
          type: string
          example: sha256
        hash:
          type: string
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        fileid:
          type: integer
          example: 12345

    RecalcManyInput:
      type: object
      required: [fileIds]
      properties:
        fileIds:
          type: array
          items:
            type: integer
          description: Filecache ids; duplicates are dropped.
          example: [100, 200, 300]
        algo:
          type: string
          description: "Any name GET /api/v1/algorithms lists for this instance."
          default: sha1
          example: sha256

    RecalcManyResponse:
      type: object
      required: [results, remaining]
      properties:
        results:
          type: array
          description: One row per file processed, in the order given.
          items:
            allOf:
              - type: object
                required: [fileid]
                properties:
                  fileid:
                    type: integer
                    example: 100
              - $ref: "#/components/schemas/RecalcResponse"
              - type: object
                properties:
                  error:
                    type: string
                    description: Why this file failed, on a row with `success` false.
                    example: "File not found."
                  excluded:
                    type: boolean
                    description: An `exclude` rule covers the file; `ruleId` names it.
                  ruleId:
                    type: string
                  forbidden:
                    type: boolean
                    description: The acting account may not calculate by hand.
        remaining:
          type: array
          items:
            type: integer
          description: >-
            The ids not processed, in the order given, once the request reached 25 files or
            100 MiB of filecache size. Send them again.
          example: [400, 500]

    StatusResponse:
      type: object
      required: [version, dbVersion, rowCount, pendingRows]
      properties:
        version:
          type: string
          description: App version
          example: "1.0.0"
        dbVersion:
          type: string
          description: Database version string
          example: "10.11.6-MariaDB"
        rowCount:
          type: integer
          description: Number of indexed hash rows
          example: 15423
        pendingRows:
          type: integer
          description: Number of pending hash updates
          example: 5

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    Rule:
      type: object
      description: >-
        `band` and `position` are computed from the rule's scope and flags and
        are read-only. There is deliberately no combined "<band>.<position>"
        field — it would be a third value derived from two already present.
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        enabled:
          type: boolean
        type:
          type: string
          enum: [include, ignore, exclude]
          default: include
          description: >-
            include hashes automatically and on request; ignore stops only
            automatic hashing; exclude blocks it by every route — the correct
            choice for storage that must not be read.
        path:
          type: string
          description: Glob, Symfony Finder `**` syntax
        selector:
          type: string
          description: >-
            Which slice of the file universe the rule addresses:
            `home:<uid>`, `group:<gid>`, `home:*`, `groupfolder:<id>`,
            `storage:<raw id>`, or `*`. Split at the first colon, so a raw
            storage id may contain further colons and slashes.
        algos:
          type: array
          items:
            type: string
          description: Include rules only
        mode:
          type: string
          enum: [auto, missing, force, lazy]
          description: Include rules only
        admin_enforced:
          type: boolean
        isDefault:
          type: boolean
          readOnly: true
          description: >-
            Computed: the rule's path is a bare catch-all, placing it in the
            trailing defaults partition of its segment.
        band:
          type: integer
          minimum: 1
          maximum: 8
          readOnly: true
        position:
          type: integer
          minimum: 1
          readOnly: true
        canEdit:
          type: boolean
          readOnly: true

    RuleInput:
      type: object
      description: >-
        `path` is not required: an absent one defaults to `/`, and on an
        update the stored value is kept. A path that is present but empty
        or blank is refused with 400.
      properties:
        enabled:
          type: boolean
        type:
          type: string
          enum: [include, ignore, exclude]
        path:
          type: string
        selector:
          type: string
          description: >-
            Administrator-only; forced to `home:<caller>` otherwise. See the
            Rule schema for the accepted forms.
        algos:
          type: array
          items:
            type: string
        mode:
          type: string
          enum: [auto, missing, force, lazy]
        admin_enforced:
          type: boolean
          description: Administrator-only; forced to false otherwise

    RuleMutationResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        rule:
          allOf:
            - $ref: "#/components/schemas/Rule"
          description: >-
            The stored rule, including the server-assigned `id`. The derived
            view fields (`band`, `position`, `canEdit`) are annotations of the
            list endpoint and are not returned here.

    RulesResponse:
      type: object
      required: [success, rules]
      properties:
        success:
          type: boolean
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
        canCreate:
          type: boolean
        supportedAlgos:
          type: array
          items:
            type: string
        modes:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            type: string
        availableUsers:
          type: array
          items:
            type: string
          description: Present only for scope=all
        availableGroups:
          type: array
          items:
            type: string
          description: Present only for scope=all
        groupFoldersAvailable:
          type: boolean
          description: >-
            Present only for scope=all. Whether the groupfolders app is
            installed and enabled; false means `groupfolder:` selectors cannot
            be offered at all.
        groupFoldersLabel:
          type: string
          nullable: true
          description: >-
            Present only for scope=all. What that app calls itself ("Team
            Folders"); null when it is absent.
        availableGroupFolders:
          type: array
          description: Present only for scope=all. The group folders that exist.
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        availableStorages:
          type: array
          items:
            type: string
          description: >-
            Present only for scope=all. Raw ids of storages only
            `storage:<id>` or `*` reaches; home storages, group folder jails,
            share wrappers and the instance root are excluded, since other
            selectors own them or no rule could match in them.

    RuleOrderInput:
      type: object
      required: [selector, orderedIds]
      properties:
        selector:
          type: string
          description: >-
            The segment being reordered. A non-administrator is always forced
            to their own, `home:<caller>`.
        defaults:
          type: boolean
          default: false
          description: >-
            Which partition of that segment: its bare catch-all rules, or the
            rest. A reorder never moves a rule across the boundary.
        orderedIds:
          type: array
          items:
            type: string
          description: Exactly a permutation of that partition's rule IDs

  responses:
    HashingExcluded:
      description: >-
        A policy refusal, one of two: an `exclude` rule covers this file, so it
        must not be read at all and a manual recalculation is refused along with
        every automatic route (`excluded: true`, with the rule in `ruleId`); or
        the account may not calculate by hand — the *manual_recalc*
        permission, which members of `admin` always hold (`forbidden: true`).
        The request is well-formed and retrying will not help, which is why this
        is 403 rather than 400. An `ignore` rule does not produce this response —
        hashing on request is what `ignore` still allows.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Hashing is excluded for this path by an administrator rule."
              excluded:
                type: boolean
                description: Always true; distinguishes a policy refusal from any other 403.
                example: true
              ruleId:
                type: string
                description: The rule that decided, as shown in the rules table.
                example: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"

    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Hash parameter is required."

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "File not found."

    RateLimited:
      description: >-
        Too many requests. The per-user rate limit for this endpoint was
        exceeded; the request was rejected by Nextcloud before reaching the
        controller. The body is empty and no Retry-After header is sent — back
        off for the length of the limit window and retry.
      content:
        application/json:
          schema:
            type: array
            maxItems: 0
            items: {}
          example: []

    Unauthorized:
      description: Not logged in
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: The caller may not perform this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Internal server error."

tags:
  - name: Lookup
    description: Hash lookup and file-level operations
  - name: Duplicates
    description: Global duplicate detection
  - name: Sudo
    description: Cross-account twins of the ordinary routes, behind a password confirmation — see the API reference's *Cross-account routes*.
  - name: Maintenance
    description: Read-only health and status
