openapi: "3.0.3"
info:
  title: FCIAS Public API
  description: |
    Public REST API for the File Checksum Index & Search (FCIAS) Nextcloud app.
    
    Provides hash lookup, duplicate detection, hash recalculation, and status endpoints.
    All endpoints require authentication via NC session cookie, HTTP Basic Auth, or Bearer token.
    
    See [docs/api-v1.md](docs/api-v1.md) for the PHP API and full documentation.
  version: "1.0.0"
  contact:
    name: metaworx
    url: https://gitlab.com/metaworx/open-source/nextcloud/file_checksum_search

servers:
  - url: https://nc.example.com/apps/file_checksum_search
    description: Typical Nextcloud instance (replace hostname)

security:
  - basicAuth: []
  - bearerAuth: []
  - cookieAuth: []

paths:
  /api/v1/lookup:
    get:
      tags: [Lookup]
      summary: Search files by hash value
      description: Find all files whose checksum matches the given hash. Optionally filter by algorithm.
      operationId: findByHash
      parameters:
        - name: hash
          in: query
          required: true
          description: Hex-encoded hash value (32, 40, 64, or 128 characters depending on algorithm)
          schema:
            type: string
            minLength: 8
            example: "da39a3ee5e6b4b0d3255bfef95601890afd80709"
        - name: algo
          in: query
          required: false
          description: Algorithm filter
          schema:
            type: string
            enum: [sha1, md5, sha256, sha512, sha3-256, sha3-512, crc32, adler32]
            example: sha1
        - name: limit
          in: query
          required: false
          description: Maximum results (1–500, default 100)
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HashLookupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/file/{fileId}/hashes:
    get:
      tags: [Lookup]
      summary: Get all checksums for a file
      description: Retrieve all computed checksums for a file by its filecache ID.
      operationId: getHashesByFileId
      parameters:
        - name: fileId
          in: path
          required: true
          description: The filecache file ID
          schema:
            type: integer
            example: 12345
      responses:
        "200":
          description: File hashes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileHashesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/file/{fileId}/duplicates:
    get:
      tags: [Lookup]
      summary: Find files sharing hash values with a given file
      description: For each algorithm for which the given file has a checksum, find other files with the same hash value.
      operationId: findSameHash
      parameters:
        - name: fileId
          in: path
          required: true
          description: The filecache file ID of the reference file
          schema:
            type: integer
            example: 12345
      responses:
        "200":
          description: Same-hash file groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SameHashResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/file/{fileId}/recalc:
    post:
      tags: [Lookup]
      summary: Recalculate hash for a file
      description: Trigger checksum recalculation for a file. Reads the file content and recomputes the hash.
      operationId: recalcHash
      parameters:
        - name: fileId
          in: path
          required: true
          description: The filecache file ID
          schema:
            type: integer
            example: 12345
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                algo:
                  type: string
                  enum: [sha1, md5, sha256, sha512, sha3-256, sha3-512, crc32, adler32]
                  default: sha1
                  description: Hash algorithm (default sha1)
                  example: sha256
      responses:
        "200":
          description: Recalculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecalcResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/HashingExcluded"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/duplicates:
    get:
      tags: [Duplicates]
      summary: Find all duplicate hash groups
      description: Find groups of files that share the same hash value. Supports filtering by algorithm, pagination, and minimum group size.
      operationId: findDuplicates
      parameters:
        - name: algo
          in: query
          required: false
          description: Algorithm filter
          schema:
            type: string
            enum: [sha1, md5, sha256, sha512, sha3-256, sha3-512, crc32, adler32]
            example: sha1
        - name: min_count
          in: query
          required: false
          description: Minimum files per duplicate group (default 2)
          schema:
            type: integer
            minimum: 2
            default: 2
        - name: limit
          in: query
          required: false
          description: Maximum groups to return (1–500, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          description: Pagination offset (default 0)
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Duplicate groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/status:
    get:
      tags: [Maintenance]
      summary: App and database status
      description: Read-only health snapshot — app version, database version, indexed row count, and pending update count.
      operationId: getStatus
      responses:
        "200":
          description: Status information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/rules:
    get:
      operationId: listRules
      summary: List hash-generation rules
      description: >-
        Rules are returned in evaluation order — first match decides. `scope`
        selects a view, not a permission: `own` lists the rules concerning the
        caller's own files and marks only their own editable, `all` is the
        administrator's whole-instance view. An administrator asking for `own`
        gets the personal view, which is what lets the personal settings page
        stay personal for everyone.
      tags: [rules]
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [own, all]
            default: own
      responses:
        "200":
          description: The rules visible in the requested view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createRule
      summary: Create a rule
      description: >-
        From a non-administrator, `userScope` is forced to the caller and
        `admin_enforced` to false whatever the payload says, and `pinned` is
        ignored. A non-administrator must also have write access to the path.
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: The stored rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/rules/order:
    put:
      operationId: reorderRuleBand
      summary: Reorder one priority band
      description: >-
        `orderedIds` must be exactly a permutation of that band's rule IDs —
        never a partial order, which would silently drop rules from evaluation.
        Band 7 (the pinned catch-all) is not orderable. Band 4 holds every
        user's own rules, so it also names whose segment is reordered; a
        non-administrator may only reorder band 4 and is always forced to their
        own segment.
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleOrderInput"
      responses:
        "200":
          description: The band was reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/rules/{id}/apply:
    post:
      tags: [Rules]
      summary: Queue a full apply pass for one rule
      description: >-
        Marks every file the rule currently governs for background hashing, uncapped.
        Enqueues a one-shot background job and returns immediately; the outcome appears in the
        server's audit log. Applying is judged as writing the rule. Refused at submission time
        for a disabled or non-include rule.
      operationId: applyRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{32}$"
      responses:
        "200":
          description: The apply pass was queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  queued:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The caller may not change this rule
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]{32}$"
    put:
      operationId: updateRule
      summary: Update a rule
      description: >-
        Enabling or disabling a rule is an update of `enabled` — there is no
        separate toggle endpoint. Omitted fields keep their stored values, so a
        minimal body is complete and safe. Changing `userScope` or
        `admin_enforced` moves the rule to the end of its new band, since
        position has no meaning across bands.
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: The stored rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteRule
      summary: Delete a rule
      description: The pinned catch-all default cannot be deleted, only disabled.
      tags: [rules]
      responses:
        "200":
          description: The rule was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Nextcloud app password as password, username as username
    bearerAuth:
      type: http
      scheme: bearer
      description: Nextcloud app password or OAuth token
    cookieAuth:
      type: apiKey
      in: cookie
      name: nc_session_id
      description: Nextcloud session cookie (for browser-based access)

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "Hash parameter is required."

    HashLookupResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/HashLookupResult"

    HashLookupResult:
      type: object
      required: [fileid, algo, hash, path, name]
      properties:
        fileid:
          type: integer
          example: 12345
        algo:
          type: string
          example: sha1
        hash:
          type: string
          example: "da39a3ee5e6b4b0d3255bfef95601890afd80709"
        path:
          type: string
          example: "Documents"
        name:
          type: string
          example: "report.pdf"

    FileHashesResponse:
      type: object
      required: [fileid, hashes]
      properties:
        fileid:
          type: integer
          example: 12345
        hashes:
          type: array
          items:
            $ref: "#/components/schemas/HashEntry"

    HashEntry:
      type: object
      required: [algo, hash]
      properties:
        algo:
          type: string
          example: sha1
        hash:
          type: string
          example: "da39a3ee5e6b4b0d3255bfef95601890afd80709"

    SameHashResponse:
      type: object
      required: [duplicates]
      properties:
        duplicates:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateGroup"

    DuplicatesResponse:
      type: object
      required: [duplicates, total_groups, pagination]
      properties:
        duplicates:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateGroup"
        total_groups:
          type: integer
          example: 1
        pagination:
          $ref: "#/components/schemas/Pagination"

    DuplicateGroup:
      type: object
      required: [algo, hash_value, file_count, files]
      properties:
        algo:
          type: string
          example: sha1
        hash_value:
          type: string
          example: "da39a3ee5e6b4b0d3255bfef95601890afd80709"
        file_count:
          type: integer
          example: 3
        files:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateFile"

    DuplicateFile:
      type: object
      required: [fileid, path, name]
      properties:
        fileid:
          type: integer
          example: 100
        path:
          type: string
          example: "Documents"
        name:
          type: string
          example: "a.pdf"

    Pagination:
      type: object
      required: [offset, limit]
      properties:
        offset:
          type: integer
          example: 0
        limit:
          type: integer
          example: 50

    RecalcResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        algo:
          type: string
          example: sha256
        hash:
          type: string
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        fileid:
          type: integer
          example: 12345

    StatusResponse:
      type: object
      required: [version, dbVersion, rowCount, pendingRows]
      properties:
        version:
          type: string
          description: App version
          example: "1.0.0"
        dbVersion:
          type: string
          description: Database version string
          example: "10.11.6-MariaDB"
        rowCount:
          type: integer
          description: Number of indexed hash rows
          example: 15423
        pendingRows:
          type: integer
          description: Number of pending hash updates
          example: 5

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    Rule:
      type: object
      description: >-
        `band` and `position` are computed from the rule's scope and flags and
        are read-only. There is deliberately no combined "<band>.<position>"
        field — it would be a third value derived from two already present.
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        enabled:
          type: boolean
        type:
          type: string
          enum: [include, ignore, exclude]
          default: include
          description: >-
            include hashes automatically and on request; ignore stops only
            automatic hashing; exclude blocks it by every route — the correct
            choice for storage that must not be read.
        path:
          type: string
          description: Glob, Symfony Finder `**` syntax
        userScope:
          type: string
          description: "`all`, `group:<gid>`, or a user ID"
        algos:
          type: array
          items:
            type: string
          description: Include rules only
        mode:
          type: string
          enum: [auto, missing, force, lazy, off]
          description: Include rules only
        admin_enforced:
          type: boolean
        pinned:
          type: boolean
          description: The single catch-all default; administrator-only
        band:
          type: integer
          minimum: 1
          maximum: 7
          readOnly: true
        position:
          type: integer
          minimum: 1
          readOnly: true
        canEdit:
          type: boolean
          readOnly: true

    RuleInput:
      type: object
      required: [path]
      properties:
        enabled:
          type: boolean
        type:
          type: string
          enum: [include, ignore, exclude]
        path:
          type: string
        userScope:
          type: string
          description: Administrator-only; forced to the caller otherwise
        algos:
          type: array
          items:
            type: string
        mode:
          type: string
          enum: [auto, missing, force, lazy, off]
        admin_enforced:
          type: boolean
          description: Administrator-only; forced to false otherwise
        pinned:
          type: boolean
          description: Administrator-only; at most one rule may be pinned

    RuleMutationResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        rule:
          $ref: "#/components/schemas/Rule"

    RulesResponse:
      type: object
      required: [success, rules]
      properties:
        success:
          type: boolean
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
        canCreate:
          type: boolean
        supportedAlgos:
          type: array
          items:
            type: string
        modes:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            type: string
        availableUsers:
          type: array
          items:
            type: string
          description: Present only for scope=all
        availableGroups:
          type: array
          items:
            type: string
          description: Present only for scope=all

    RuleOrderInput:
      type: object
      required: [band, orderedIds]
      properties:
        band:
          type: integer
          minimum: 1
          maximum: 6
        ownerId:
          type: string
          description: Required for band 4; ignored for a non-administrator
        orderedIds:
          type: array
          items:
            type: string
          description: Exactly a permutation of that band's rule IDs

  responses:
    HashingExcluded:
      description: >-
        An `exclude` rule covers this file, so it must not be read at all and a
        manual recalculation is refused along with every automatic route. The
        request is well-formed and retrying will not help, which is why this is
        403 rather than 400. An `ignore` rule does not produce this response —
        hashing on request is what `ignore` still allows.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Hashing is excluded for this path by an administrator rule."
              excluded:
                type: boolean
                description: Always true; distinguishes a policy refusal from any other 403.
                example: true
              ruleId:
                type: string
                description: The rule that decided, as shown in the rules table.
                example: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"

    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Hash parameter is required."

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "File not found."

    RateLimited:
      description: >-
        Too many requests. The per-user rate limit for this endpoint was
        exceeded; the request was rejected by Nextcloud before reaching the
        controller. The body is empty and no Retry-After header is sent — back
        off for the length of the limit window and retry.
      content:
        application/json:
          schema:
            type: array
            maxItems: 0
            items: {}
          example: []

    Unauthorized:
      description: Not logged in
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: The caller may not perform this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Internal server error."

tags:
  - name: Lookup
    description: Hash lookup and file-level operations
  - name: Duplicates
    description: Global duplicate detection
  - name: Maintenance
    description: Read-only health and status
