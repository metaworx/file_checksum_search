name: Post-publish verification

# Installs the release the store has just published on fresh servers, the
# two ways an administrator can — `occ app:install`, and the Apps page's
# Download and enable — then checks that every install step happened and
# runs a smoke test of the e2e suite against the installed copy: the
# shipped tarball, built frontend, no dev packages, verified by the server
# against the app's certificate. publish.yml calls it once the store has
# accepted a release; it can be run by hand for a version already listed.
on:
  workflow_call:
    inputs:
      version:
        description: The version the store published, e.g. 0.20.3
        type: string
        required: true
      kind:
        description: nightly or stable
        type: string
        required: true
      tag:
        description: The tag whose tests to run; v<version> when empty
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: The version the store lists, e.g. 0.20.2
        type: string
        required: true
      kind:
        description: How the store lists it
        type: choice
        options: [ nightly, stable ]
        default: nightly
      tag:
        description: The tag whose tests to run; v<version> when empty
        type: string
        default: ''

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.mode }} / NC ${{ matrix.nextcloud-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        nextcloud-version: [ 'stable33', 'stable34' ]
        mode: [ 'occ', 'web' ]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nextcloud
          MYSQL_USER: nextcloud
          MYSQL_PASSWORD: nextcloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      VERSION: ${{ inputs.version }}
      NIGHTLY: ${{ inputs.kind == 'nightly' }}

    steps:
      - name: Checkout the release's tests
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || format('v{0}', inputs.version) }}

      # A git checkout of the server is on the `git` channel, which shows
      # nightlies to everyone; a server as its administrator runs it is on
      # `stable`. Only a nightly's Apps-page install moves it to `daily`,
      # the one channel on which the Apps page lists nightlies (`beta`
      # lists pre-releases, not nightlies).
      - name: Nextcloud with the app store
        uses: ./.github/actions/nextcloud-e2e
        with:
          nextcloud-version: ${{ matrix.nextcloud-version }}
          app-store: 'true'
          channel: ${{ (inputs.kind == 'nightly' && matrix.mode == 'web') && 'daily' || 'stable' }}

      # The store's listings are cached for a while after an upload, and the
      # server keeps what it fetched for an hour: wait until the listing for
      # this server's version names the release, then drop the server's copy.
      - name: Wait until the store lists the release for this server
        working-directory: nextcloud
        run: |
          server="$(php occ config:system:get version | cut -d. -f1-3)"
          url="https://apps.nextcloud.com/api/v1/platform/${server}/apps.json"
          echo "waiting for ${VERSION} (nightly: ${NIGHTLY}) in ${url}"
          for i in $(seq 1 30); do
            if curl -fsSL "$url" | python3 -c "
          import json, os, sys
          for app in json.load(sys.stdin):
              if app['id'] == 'file_checksum_search':
                  for release in app['releases']:
                      if release['version'] == os.environ['VERSION'] and release['isNightly'] == (os.environ['NIGHTLY'] == 'true'):
                          sys.exit(0)
          sys.exit(1)
          "; then
              echo "listed after ${i} tries"
              rm -f data/appdata_*/appstore/apps.json
              exit 0
            fi
            sleep 60
          done
          echo "::error::The store does not list ${VERSION} for Nextcloud ${server} after 30 minutes."
          exit 1

      - name: Install with occ
        if: matrix.mode == 'occ'
        working-directory: nextcloud
        run: |
          if [ "$NIGHTLY" = true ]; then
            php occ app:install --allow-unstable file_checksum_search
          else
            php occ app:install file_checksum_search
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Serve Nextcloud
        uses: ./.github/actions/nextcloud-serve

      - name: Install through the Apps page
        if: matrix.mode == 'web'
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          spec: tests/e2e/store/install-from-apps-page.cy.js
          install: false
          wait-on: 'http://localhost:8081/index.php'
          wait-on-timeout: 120
        env:
          CYPRESS_baseUrl: http://localhost:8081
          CYPRESS_storeInstall: ${{ inputs.version }}

      - name: The install steps happened
        id: check
        run: bash tests/e2e/store/check-install.sh nextcloud "$VERSION"

      # Whenever the check ran, pass or fail: a missing install step and a
      # broken app are two findings, and one should not hide the other.
      - name: Smoke test
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          spec: tests/e2e/checksums.cy.js,tests/e2e/global-search.cy.js
          install: false
          wait-on: 'http://localhost:8081/index.php'
          wait-on-timeout: 120
        env:
          CYPRESS_baseUrl: http://localhost:8081

      - name: Keep Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: post-publish-${{ matrix.mode }}-${{ matrix.nextcloud-version }}
          path: cypress/screenshots
          if-no-files-found: ignore
