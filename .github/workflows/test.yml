name: Nextcloud App Testing Matrix
on: [ push, pull_request ]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm ci

      # Deliberately its own job rather than a step on the integration job:
      # it needs no Nextcloud server, so it answers in under a minute, and a
      # style failure should not be reported as an end-to-end failure.
      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run stylelint

      - name: PHP syntax check
        run: composer lint

      # What the app store validates at upload, validated here first; the
      # schema is fetched so the check follows the store.
      - name: App manifest against the store's schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxml2-utils
          curl -fsSL -o info.xsd https://raw.githubusercontent.com/nextcloud/appstore/master/nextcloudappstore/api/v1/release/info.xsd
          xmllint --noout --schema info.xsd appinfo/info.xml

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextcloud-version: [ 'stable33', 'stable34' ]
        php-version: [ '8.2', '8.3', '8.4' ]
    name: NC ${{ matrix.nextcloud-version }} / PHP ${{ matrix.php-version }}

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nextcloud
          MYSQL_USER: nextcloud
          MYSQL_PASSWORD: nextcloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      - name: Set up Nextcloud environment
        uses: nextcloud/setup-server-action@v0.5.0
        with:
          nextcloud-version: ${{ matrix.nextcloud-version }}
          php-version: ${{ matrix.php-version }}
          install: true
          database: mysql

      - name: Inject app into Nextcloud
        run: |
          mkdir -p nextcloud/apps/file_checksum_search
          rsync -a --exclude='.git' --exclude='nextcloud' ./ nextcloud/apps/file_checksum_search/

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-scripts
        working-directory: nextcloud/apps/file_checksum_search

      - name: Install PHPUnit (bamarni bin)
        run: composer bin phpunit install --no-interaction
        working-directory: nextcloud/apps/file_checksum_search

      - name: Enable the app
        run: php occ app:enable file_checksum_search
        working-directory: nextcloud

      - name: Create HTTP test user
        run: |
          NC_PASS='Str0ng!T3st#P4ss!' php occ user:add --password-from-env fcias_http_test
        working-directory: nextcloud

      # The tests hard-code http://127.0.0.1, so the server needs port 80,
      # and it must run as the runner: a server started with sudo creates
      # every test account's home as root, and the PHPUnit process then
      # cannot write inside it. The capability lets an unprivileged process
      # bind the port.
      - name: Start Nextcloud HTTP server
        run: |
          PHP_BIN="$(readlink -f "$(command -v php)")"
          sudo setcap cap_net_bind_service=+ep "$PHP_BIN"
          "$PHP_BIN" -S 127.0.0.1:80 -t . > /tmp/nc-http.log 2>&1 &
        working-directory: nextcloud

      - name: Wait for HTTP server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/status.php > /dev/null 2>&1; then
              echo "HTTP server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "HTTP server did not become ready in 30s" >&2
          exit 1

      - name: Run PHPUnit tests
        run: php -d error_reporting='E_ALL & ~E_DEPRECATED' ./vendor/bin/phpunit -c tests/phpunit.xml --display-warnings
        working-directory: nextcloud/apps/file_checksum_search

  integration-chrome:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextcloud-version: [ 'stable33', 'stable34' ]
    name: Cypress E2E / NC ${{ matrix.nextcloud-version }}

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nextcloud
          MYSQL_USER: nextcloud
          MYSQL_PASSWORD: nextcloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      - name: Set up Nextcloud Server Instance
        uses: nextcloud/setup-server-action@v0.5.0
        with:
          nextcloud-version: ${{ matrix.nextcloud-version }}
          install: true
          node-version: '24'
          database: mysql

      - name: Configure Nextcloud for E2E (disable app store, force English)
        run: |
          php occ config:system:set upgrade.disable-web --value=true
          php occ config:system:set appstoreenabled --value=false --type=boolean
          php occ config:system:set default_language --value=en
          php occ config:system:set force_language --value=en
          php occ app:disable firstrunwizard
        working-directory: nextcloud

      - name: Inject app into integration instance
        run: |
          mkdir -p nextcloud/apps/file_checksum_search
          rsync -a --exclude='.git' --exclude='nextcloud' ./ nextcloud/apps/file_checksum_search/

      - name: Enable the app
        run: php occ app:enable file_checksum_search
        working-directory: nextcloud

      - name: Install Frontend Node Dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Copy built frontend assets into the app
        run: rsync -a css js nextcloud/apps/file_checksum_search/

      - name: Start Nextcloud
        run: |
          php -S 0.0.0.0:8081 -t . &
        working-directory: nextcloud
        env:
          PHP_CLI_SERVER_WORKERS: 3

      - name: Warm up Nextcloud HTTP server
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8081/status.php && break
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:8081/index.php/login || true

      - name: Run Integration Tests (Headless Chrome)
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          spec: tests/e2e/**/*.cy.js
          install: false
          wait-on: 'http://localhost:8081/index.php'
          wait-on-timeout: 120
        env:
          CYPRESS_baseUrl: http://localhost:8081

      # What GitLab keeps of a failed run, kept here too: the screenshot
      # Cypress takes at the failing step is most of a diagnosis.
      - name: Keep Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-${{ matrix.nextcloud-version }}
          path: cypress/screenshots
          if-no-files-found: ignore
