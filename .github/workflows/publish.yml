name: Publish to Nextcloud App Store

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build, sign and publish app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Read app version
        id: app-meta
        run: |
          version="$(sed -n 's|.*<version>\([^<]*\)</version>.*|\1|p' appinfo/info.xml | head -n1 | tr -d '[:space:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and package app
        run: bash package.sh

      - name: Sign app archive (openssl)
        if: vars.APPSTORE_SIGNING_ENABLED == 'true'
        env:
          APPSTORE_KEY: ${{ secrets.APPSTORE_KEY }}
          APPSTORE_CERT: ${{ secrets.APPSTORE_CERT }}
        run: bash package.sh --sign-only

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/file_checksum_search.tar.gz
            build/file_checksum_search-${{ steps.app-meta.outputs.version }}.tar.gz

      - name: Upload signature
        if: github.event_name == 'release' && vars.APPSTORE_SIGNING_ENABLED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/file_checksum_search-${{ steps.app-meta.outputs.version }}.tar.gz.signature

      - name: Publish release to App Store
        if: github.event_name == 'release' && vars.APPSTORE_PUBLISH == 'true'
        env:
          API_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          APPSTORE_KEY: ${{ secrets.APPSTORE_KEY }}
          DOWNLOAD_URL: "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/file_checksum_search.tar.gz"
        run: |
          set -euo pipefail
          printf '%s\n' "$APPSTORE_KEY" > .appstore-key.pem
          SIGNATURE="$(openssl dgst -sha512 -sign .appstore-key.pem build/file_checksum_search.tar.gz | openssl base64 -A)"
          rm -f .appstore-key.pem
          curl -sS -X POST https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Authorization: Token ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"download\":\"${DOWNLOAD_URL}\",\"signature\":\"${SIGNATURE}\",\"nightly\":false}" \
            -w "\nHTTP %{http_code}\n"
