name: Publish to Nextcloud App Store

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build, sign and publish app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Read app version
        id: app-meta
        run: |
          version="$(sed -n 's|.*<version>\([^<]*\)</version>.*|\1|p' appinfo/info.xml | head -n1 | tr -d '[:space:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, package, and sign app
        env:
          APPSTORE_KEY: ${{ secrets.APPSTORE_KEY }}
          APPSTORE_CERT: ${{ secrets.APPSTORE_CERT }}
        run: bash package.sh

      - name: Classify release tag
        id: tagkind
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "kind=stable" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
            echo "kind=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "kind=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release assets
        if: github.event_name == 'release' && steps.tagkind.outputs.kind != 'skip'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/file_checksum_search.tar.gz
            build/file_checksum_search-${{ steps.app-meta.outputs.version }}.tar.gz

      - name: Upload signature
        if: github.event_name == 'release' && steps.tagkind.outputs.kind != 'skip' && hashFiles('build/*.signature') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: build/file_checksum_search-${{ steps.app-meta.outputs.version }}.tar.gz.signature

      - name: Publish release to App Store
        if: github.event_name == 'release' && steps.tagkind.outputs.kind != 'skip' && vars.APPSTORE_PUBLISH == 'true'
        env:
          API_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          APPSTORE_KEY: ${{ secrets.APPSTORE_KEY }}
          DOWNLOAD_URL: "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/file_checksum_search-${{ steps.app-meta.outputs.version }}.tar.gz"
        run: |
          NIGHTLY_FLAG=""
          if [ "${{ steps.tagkind.outputs.kind }}" = "nightly" ]; then
            NIGHTLY_FLAG="--nightly"
          fi
          bash package.sh --appstore $NIGHTLY_FLAG
