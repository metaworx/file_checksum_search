name: Publish to Nextcloud App Store

# Runs once the test workflow has finished for a tag. A release made with
# GITHUB_TOKEN fires no `release` event, so no workflow can wait for a
# release the tag's own run creates; this one waits for the tag's test
# run instead, and publishes the tree those tests passed on.
on:
  workflow_run:
    workflows: [ "Nextcloud App Testing Matrix" ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, release and publish, e.g. v0.21.0
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and release
    runs-on: ubuntu-latest
    # A test run that succeeded for a pushed tag; for a tag push the run's
    # head_branch is the tag's name.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && startsWith(github.event.workflow_run.head_branch, 'v')
      )
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    outputs:
      tag: ${{ env.TAG }}
      version: ${{ steps.app-meta.outputs.version }}
      kind: ${{ steps.tagkind.outputs.kind }}
    steps:
      # The tag's tree, and the guidelines submodule for changelog.sh.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Read app version
        id: app-meta
        run: |
          version="$(sed -n 's|.*<version>\([^<]*\)</version>.*|\1|p' appinfo/info.xml | head -n1 | tr -d '[:space:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "v${version}" != "${TAG%%-*}" ]; then
            echo "The manifest says ${version} and the tag says ${TAG}" >&2
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      # Publishing is the one place an unlinted build cannot be taken back,
      # so the same checks that gate a push gate a release.
      - name: Lint frontend
        run: |
          npm run lint
          npm run stylelint

      - name: Build, package, and sign app
        env:
          APPSTORE_KEY: ${{ secrets.APPSTORE_KEY }}
          APPSTORE_CERT: ${{ secrets.APPSTORE_CERT }}
        run: bash package.sh

      - name: Classify release tag
        id: tagkind
        run: |
          # 0.x is pre-release by definition (see CHANGELOG.md) — never stable,
          # with or without a -suffix. Must stay ahead of the strict semver
          # branch below, which would otherwise claim plain v0.Y.Z.
          if [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "kind=nightly" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "kind=stable" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
            echo "kind=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "kind=skip" >> "$GITHUB_OUTPUT"
          fi

      # The body a tag carries: the changelog section, nothing else.
      - name: Release notes
        if: steps.tagkind.outputs.kind != 'skip'
        run: bash GUIDELINES/shared/tools/changelog.sh notes "${{ steps.app-meta.outputs.version }}" > build/release-notes.md

      # Created here when the tag has no release yet, updated otherwise;
      # the assets go up before the store is told, since it fetches the
      # download URL on being told.
      - name: Create the GitHub release with its assets
        if: steps.tagkind.outputs.kind != 'skip'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: build/release-notes.md
          prerelease: ${{ steps.tagkind.outputs.kind == 'nightly' }}
          files: |
            build/file_checksum_search.tar.gz
            build/file_checksum_search-${{ steps.app-meta.outputs.version }}.tar.gz
            build/file_checksum_search-${{ steps.app-meta.outputs.version }}.tar.gz.signature

  # The store upload, on its own so that it shows as a job of its own: it
  # waits in the `appstore` environment for whatever protection rules the
  # environment carries — a required reviewer, a wait timer, the tags it
  # may run for — and a refusal by the store fails it. The environment also
  # holds the store's secrets, so no other job can read them.
  store:
    name: Publish to the App Store
    needs: release
    if: needs.release.outputs.kind != 'skip'
    runs-on: ubuntu-latest
    environment: appstore
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      DOWNLOAD_URL: "https://github.com/${{ github.repository }}/releases/download/${{ needs.release.outputs.tag }}/file_checksum_search-${{ needs.release.outputs.version }}.tar.gz"
    steps:
      # package.sh and the manifest it reads the version from.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # The asset the store will fetch, fetched the way the store fetches it:
      # anonymously, from the release. A broken asset fails here, before the
      # store is told about it.
      - name: Download the release asset
        run: |
          mkdir -p build
          curl -fsSL -o "build/file_checksum_search-${VERSION}.tar.gz" "$DOWNLOAD_URL"

      - name: Sign and post the release to the App Store
        env:
          API_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          APPSTORE_KEY: ${{ secrets.APPSTORE_KEY }}
        run: |
          NIGHTLY_FLAG=""
          if [ "${{ needs.release.outputs.kind }}" = "nightly" ]; then
            NIGHTLY_FLAG="--nightly"
          fi
          bash package.sh --appstore $NIGHTLY_FLAG

  # The release as the store hands it out, installed by occ and through the
  # Apps page on fresh servers, its install steps checked, and a smoke run
  # of the e2e suite against it.
  verify:
    name: Install from the store
    needs: [ release, store ]
    uses: ./.github/workflows/post-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
      kind: ${{ needs.release.outputs.kind }}
      tag: ${{ needs.release.outputs.tag }}
