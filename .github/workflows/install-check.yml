name: Install check

# Installs a release on fresh servers the two ways an administrator can -
# `occ app:install`, and the Apps page's Download and enable - then checks
# that every install step happened and the app's own checks pass
# (tests/e2e/store/check-install.sh, with tests/e2e/store/checks.sh), and
# runs the browser tests the app names against the installed copy: the
# shipped tarball, built frontend, no dev packages, verified by the server
# against the app's certificate.
#
# What is the app's own here is read from .github/app.env: APT_PACKAGES the
# install needs, SMOKE_SPECS the browser tests to run, E2E whether the
# server is configured for them. Each left unset leaves its step out. The
# release's file where it has one, else the workflow's own ref's.
#
# Against the fake store: the real store's full listing with the release
# added from its GitHub release, or, before the app's first release, an
# entry made from its manifest and certificate. publish.yml runs it before
# the upload, so a release that does not install never reaches the store.
# It can also be run by hand against a release that is out.
on:
  workflow_call:
    inputs:
      version:
        description: The version under test, e.g. 0.20.3
        type: string
        required: true
      kind:
        description: nightly or stable
        type: string
        required: true
      tag:
        description: The tag whose tests to run and whose release holds the tarball; v<version> when empty
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: The version under test, e.g. 0.20.3
        type: string
        required: true
      kind:
        description: How the release is listed
        type: choice
        options: [ nightly, stable ]
        default: nightly
      tag:
        description: The tag whose tests to run and whose release holds the tarball; v<version> when empty
        type: string
        default: ''

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.mode }} / NC ${{ matrix.nextcloud-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        nextcloud-version: [ 'stable33', 'stable34', 'stable35' ]
        mode: [ 'occ', 'web' ]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nextcloud
          MYSQL_USER: nextcloud
          MYSQL_PASSWORD: nextcloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout the release's tests
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || format('v{0}', inputs.version) }}

      # The release's own file where the tag has one. A release tagged before
      # the app had this file, published through the master dispatch, takes
      # the file at the ref this workflow runs from - the caller's commit, in
      # a workflow_call - so that its install still gets its packages.
      - name: The app's settings
        id: app
        run: |
          if [ -f .github/app.env ]; then
            set -a
            . ./.github/app.env
            set +a
          elif git fetch --quiet --depth 1 origin "$GITHUB_SHA" &&
               git show "$GITHUB_SHA:.github/app.env" > /tmp/app.env 2>/dev/null; then
            echo "the release carries no .github/app.env; reading the workflow's own"
            set -a
            . /tmp/app.env
            set +a
          fi
          {
            echo "apt-packages=${APT_PACKAGES:-}"
            echo "smoke-specs=${SMOKE_SPECS:-}"
            echo "e2e=${E2E:-false}"
          } >> "$GITHUB_OUTPUT"

      - name: Packages the install needs
        if: steps.app.outputs.apt-packages != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ${{ steps.app.outputs.apt-packages }}

      # A git checkout of the server is on the `git` channel, which shows
      # nightlies to everyone; a server as its administrator runs it is on
      # `stable`. Only a nightly's Apps-page install moves it to `daily`,
      # the one channel on which the Apps page lists nightlies.
      - name: Nextcloud with the app store
        uses: ./.github/actions/nextcloud-server
        with:
          nextcloud-version: ${{ matrix.nextcloud-version }}
          e2e: ${{ steps.app.outputs.e2e }}
          app-store: 'true'
          channel: ${{ (inputs.kind == 'nightly' && matrix.mode == 'web') && 'daily' || 'stable' }}

      # The certificate lists the app in the fake store before its first
      # release, when the real store has no entry for it to extend.
      - name: App store
        uses: ./.github/actions/app-store
        env:
          APPSTORE_CERT: ${{ vars.APPSTORE_CERT || secrets.APPSTORE_CERT }}
        with:
          version: ${{ inputs.version }}
          kind: ${{ inputs.kind }}
          tag: ${{ inputs.tag != '' && inputs.tag || format('v{0}', inputs.version) }}
          occ-install: ${{ matrix.mode == 'occ' }}

      - name: Node dependencies
        uses: ./.github/actions/node-deps

      - name: Serve Nextcloud
        uses: ./.github/actions/nextcloud-serve

      - name: Install through the Apps page
        if: matrix.mode == 'web'
        uses: ./.github/actions/cypress-run
        with:
          spec: tests/e2e/store/install-from-apps-page.cy.js
          artifact-name: install-${{ matrix.nextcloud-version }}
        env:
          CYPRESS_baseUrl: http://localhost:8081
          CYPRESS_storeInstall: ${{ inputs.version }}

      - name: The install steps happened, and the app's checks pass
        id: check
        run: bash tests/e2e/store/check-install.sh nextcloud "$VERSION"

      # Whenever the check ran, pass or fail: a missing install step and a
      # broken page are two findings, and one should not hide the other.
      - name: Smoke test
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' && steps.app.outputs.smoke-specs != '' }}
        uses: ./.github/actions/cypress-run
        with:
          spec: ${{ steps.app.outputs.smoke-specs }}
          artifact-name: smoke-${{ matrix.mode }}-${{ matrix.nextcloud-version }}
        env:
          CYPRESS_baseUrl: http://localhost:8081

      # The server's side of a failure: the Apps page shows a spinner and a
      # status code, the logs say why. Here rather than in an action, which
      # comes from the release's checkout and so cannot be added afterwards.
      - name: Server logs
        if: failure()
        working-directory: nextcloud
        run: |
          echo "::group::PHP's web server"
          cat /tmp/nc-http.log || true
          echo "::endgroup::"
          log="$(php occ config:system:get datadirectory)/nextcloud.log"
          echo "::group::$log"
          tail -n 300 "$log" || true
          echo "::endgroup::"
