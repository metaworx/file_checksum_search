name: Node dependencies
description: Node.js 24 with npm's cache, and the frontend dependencies from the lock file.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: npm

    # Without Cypress's binary, about 240 MB to download: the one job that
    # runs Cypress takes it from GitHub's cache (cypress-run).
    - name: Install frontend dependencies
      shell: bash
      env:
        CYPRESS_INSTALL_BINARY: '0'
      run: npm ci
