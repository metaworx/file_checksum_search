name: Node dependencies
description: Node.js 24 with npm's cache, and the frontend dependencies from the lock file.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: npm

    - name: Install frontend dependencies
      shell: bash
      run: npm ci
