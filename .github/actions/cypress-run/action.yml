name: Cypress run
description: >-
  The given specs in headless Chrome against the server on port 8081, and
  the screenshots Cypress took kept as an artifact when a spec fails.
  CYPRESS_* variables set on the calling step reach the run. The node
  dependencies must be installed first.

inputs:
  spec:
    description: The spec or specs, comma-separated
    required: true
  artifact-name:
    description: The name of the screenshots artifact
    required: true

runs:
  using: composite
  steps:
    # node-deps installs with CYPRESS_INSTALL_BINARY=0, so that no other job
    # downloads it, and npm may not run the package's install script at all:
    # the binary of the pinned version, about 240 MB, comes from GitHub's
    # cache, keyed on that version, and from Cypress's server only where the
    # cache has none yet - once per version rather than once per job.
    - name: Cypress version
      id: cypress
      shell: bash
      run: echo "version=$(node -p "require('./package.json').devDependencies.cypress")" >> "$GITHUB_OUTPUT"

    - name: Cypress binary from the cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ steps.cypress.outputs.version }}

    # A no-op where the cache brought the binary.
    - name: Cypress binary
      shell: bash
      run: npx cypress install

    - name: Run the specs
      uses: cypress-io/github-action@v7
      with:
        browser: chrome
        spec: ${{ inputs.spec }}
        install: false
        wait-on: 'http://localhost:8081/index.php'
        wait-on-timeout: 120

    # What a failed run leaves: the screenshot Cypress takes at the failing
    # step is most of a diagnosis.
    - name: Keep Cypress screenshots
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact-name }}
        path: cypress/screenshots
        if-no-files-found: ignore
