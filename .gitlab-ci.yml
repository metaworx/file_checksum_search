stages:
  - test
  - build
  - release
  - publish

variables:
  APP_ID: file_checksum_search

test:
  stage: test
  image: node:24-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends php-cli php-xml php-mbstring php-intl php-gd php-curl php-zip php-sqlite3 rsync openssl unzip wget
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer --quiet
    - rm -f composer-setup.php
    - wget -q https://download.nextcloud.com/server/releases/latest-33.zip -O nextcloud.zip
    - unzip -q nextcloud.zip
    - test -d nextcloud || mv nextcloud-* nextcloud
    - mkdir -p nextcloud/apps
    - rsync -a --exclude='.git' --exclude='nextcloud' ./ "nextcloud/apps/${APP_ID}/"
  script:
    - cd nextcloud
    - php occ maintenance:install --database=sqlite --database-name=nextcloud --admin-user=admin --admin-pass=admin
    - cd "apps/${APP_ID}"
    - composer install --no-interaction
    - php ../../occ app:enable "${APP_ID}"
    - php -d error_reporting='E_ALL & ~E_DEPRECATED' vendor/bin/phpunit -c tests/phpunit.xml --testsuite unit --display-warnings

e2e:
  stage: test
  image: node:24-bookworm
  parallel:
    matrix:
      - NC_VERSION: [ '33', '34' ]
  variables:
    CYPRESS_baseUrl: 'http://localhost:8081'
    CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/Cypress"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .cache/Cypress
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends gnupg php-cli php-xml php-mbstring php-intl php-gd php-curl php-zip php-sqlite3 rsync openssl unzip wget libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 libasound2 libxtst6 xauth xvfb
    # Google Chrome (headless) for Cypress
    - wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends google-chrome-stable
    # Nextcloud
    - wget -q "https://download.nextcloud.com/server/releases/latest-${NC_VERSION}.zip" -O nextcloud.zip
    - unzip -q nextcloud.zip
    - test -d nextcloud || mv nextcloud-* nextcloud
    - mkdir -p nextcloud/apps
    - rsync -a --exclude='.git' --exclude='nextcloud' --exclude='node_modules' --exclude='vendor' --exclude='build' --exclude='cypress' --exclude='js' --exclude='css' ./ "nextcloud/apps/${APP_ID}/"
    - cd nextcloud
    - php occ maintenance:install --database=sqlite --database-name=nextcloud --admin-user=admin --admin-pass=admin
    - php occ config:system:set upgrade.disable-web --value=true
    - php occ config:system:set appstoreenabled --value=false --type=boolean
    - php occ config:system:set default_language --value=en
    - php occ config:system:set force_language --value=en
    - php occ app:disable firstrunwizard
    - cd "$CI_PROJECT_DIR"
    - npm ci
    - npm run build
    - rsync -a css js "nextcloud/apps/${APP_ID}/"
    - cd nextcloud
    - php occ app:enable "${APP_ID}"
    - cd "$CI_PROJECT_DIR"
  script:
    - cd nextcloud
    - php -S 0.0.0.0:8081 -t . > /tmp/nc-http.log 2>&1 &
    - cd "$CI_PROJECT_DIR"
    - |
      for i in $(seq 1 60); do
        curl -fsS -o /dev/null http://localhost:8081/status.php && break
        sleep 1
      done
      curl -fsS -o /dev/null http://localhost:8081/index.php/login || true
    - npx cypress run --browser chrome
  artifacts:
    when: always
    paths:
      - cypress/screenshots/
      - cypress/videos/
    expire_in: 1 week

build:
  stage: build
  image: node:24-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends php-cli php-xml php-mbstring rsync openssl
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer --quiet
    - rm -f composer-setup.php
    - composer --version
  script:
    - |
      if [ -n "${APPSTORE_KEY_B64:-}" ]; then
        echo "$APPSTORE_KEY_B64" | base64 -d > key.pem
        export APPSTORE_KEY="$PWD/key.pem"
        echo "Signing enabled (APPSTORE_KEY_B64 decoded)."
      else
        echo "APPSTORE_KEY_B64 not set — building unsigned (Option B)."
      fi
    - bash package.sh
    - |
      if [ -f key.pem ]; then
        dd if=/dev/urandom of=key.pem bs=4096 count=1 status=none 2>/dev/null || true
        sync || true
      fi
    - rm -f key.pem
    - echo "APP_VERSION=$(sed -n 's|.*<version>\([^<]*\)</version>.*|\1|p' appinfo/info.xml | head -n1 | tr -d '[:space:]')" > build.env
  artifacts:
    paths:
      - build/
    reports:
      dotenv: build.env
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    name: 'FCIAS ${CI_COMMIT_TAG}'
    tag_name: '${CI_COMMIT_TAG}'
    ref: '${CI_COMMIT_SHA}'
    description: |
      Release ${CI_COMMIT_TAG}.

      Artifacts are produced by the `build` job. The signature asset is only
      available when the `APPSTORE_KEY_B64` / `APPSTORE_CERT` CI variables
      are set.
    assets:
      links:
        - name: '${APP_ID}.tar.gz'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/build/${APP_ID}.tar.gz?job=build'
        - name: '${APP_ID}-${APP_VERSION}.tar.gz'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/build/${APP_ID}-${APP_VERSION}.tar.gz?job=build'
        - name: '${APP_ID}-${APP_VERSION}.tar.gz.signature'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/build/${APP_ID}-${APP_VERSION}.tar.gz.signature?job=build'

publish_appstore:
  stage: publish
  image: alpine:latest
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG && $APPSTORE_PUBLISH == "true"'
  before_script:
    - apk add --no-cache openssl curl
  script:
    - DOWNLOAD_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${APP_ID}/${CI_COMMIT_TAG}/${APP_ID}.tar.gz"
    - 'curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "build/${APP_ID}.tar.gz" "${DOWNLOAD_URL}"'
    - echo "$APPSTORE_KEY_B64" | base64 -d > key.pem
    - SIGNATURE="$(openssl dgst -sha512 -sign key.pem "build/${APP_ID}.tar.gz" | openssl base64 -A)"
    - |
      if [ -f key.pem ]; then
        dd if=/dev/urandom of=key.pem bs=4096 count=1 status=none 2>/dev/null || true
        sync || true
      fi
    - rm -f key.pem
    - |
      curl -X POST https://apps.nextcloud.com/api/v1/apps/releases \
        -H "Authorization: Token ${APPSTORE_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{\"download\":\"${DOWNLOAD_URL}\",\"signature\":\"${SIGNATURE}\",\"nightly\":false}"
