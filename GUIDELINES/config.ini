# Configuration for the guidelines tooling. Tracked on purpose: every agent,
# script and generated document resolves its paths through these values.
#
# This is git config format, read with "git config --file". git is already a
# hard requirement here - the shared guidelines are a submodule - so the shell
# and PowerShell tools share one parser instead of each hand-rolling its own.
# Machine-specific values belong in config.local.ini, which is not tracked.

# Where the agent documents live, relative to the project root.
#
#   {{guidelines_root}} - this directory: the project's own fragments, plus the
#                         runtime messages/ and temp/ directories
#   {{shared_root}}     - the shared guidelines submodule
[guidelines]
	root = GUIDELINES
	shared = GUIDELINES/shared

[project]
	# Substituted for {{project_name}} and {{project_acronym}} in every
	# generated document. An empty acronym falls back to the name.
	name = File Checksum Index & Search
	acronym = FCIAS

	# The app id, rendered for {{project_app_id}} in the files copied under
	# [vendor] below.
	app-id = file_checksum_search

	# Languages this project is written in; each names a lang/<language>/
	# directory in the shared guidelines. Maintained by
	# tools/detect-languages.sh, and kept honest by its --check in CI.
	languages = php, ts, js, python, shell, css, json, xml

	# Paths whose change obliges a CHANGELOG bullet (COMMIT.md 5), as git
	# pathspecs; the key repeats. changelog.sh check enforces them, and
	# changelog.sh update-contract lists them in project/_CONTRACT.md.
	#
	# What the app ships: its code, frontend source and build, translations,
	# templates, images, and the two manifests Nextcloud reads.
	shipped = lib/
	shipped = src/
	shipped = css/
	shipped = js/
	shipped = l10n/
	shipped = templates/
	shipped = img/
	shipped = appinfo/routes.php
	shipped = appinfo/info.xml
	# And what it does not, named so that a path neither list covers is
	# reported as new rather than passing unclassified: every file at the
	# root (manifests of the build, configs, documents), then the rest.
	shipped = :(exclude,glob)*
	shipped = :!tests/
	shipped = :!docs/
	shipped = :!scripts/
	shipped = :!translationfiles/
	shipped = :!vendor-bin/
	shipped = :!GUIDELINES/
	shipped = :!.github/
	shipped = :!.gitlab/
	shipped = :!.idea/
	shipped = :!.roo/

	# The changelog COMMIT.md 5 obliges; AGENTS.md 3.3 says this project
	# keeps one. Unset, changelog.sh check exits saying there is none.
	changelog = CHANGELOG.md

# What the changelog releases: appinfo/info.xml is the version manifest,
# whose <version> changelog.sh cut sets and check holds to the newest section.
# The path is relative to the changelog, which sits at the project root.
[changelog "CHANGELOG.md"]
	manifest = appinfo/info.xml

# The release and CI tooling of a Nextcloud app, from the guidelines'
# platform/nextcloud/ (its README says what each file is), copied here by
# tools/sync-vendor.sh and recorded in GUIDELINES/vendor.sources. An edit to
# a copy goes there; this app's own values are .github/app.env and
# tests/e2e/store/checks.sh.
[vendor]
	file = platform/nextcloud/actions/release-meta/action.yml .github/actions/release-meta/action.yml
	file = platform/nextcloud/actions/node-deps/action.yml .github/actions/node-deps/action.yml
	file = platform/nextcloud/actions/nextcloud-server/action.yml .github/actions/nextcloud-server/action.yml
	file = platform/nextcloud/actions/app-into-server/action.yml .github/actions/app-into-server/action.yml
	file = platform/nextcloud/actions/nextcloud-serve/action.yml .github/actions/nextcloud-serve/action.yml
	file = platform/nextcloud/actions/cypress-run/action.yml .github/actions/cypress-run/action.yml
	file = platform/nextcloud/actions/app-store/action.yml .github/actions/app-store/action.yml
	file = platform/nextcloud/workflows/publish.yml .github/workflows/publish.yml
	file = platform/nextcloud/workflows/install-check.yml .github/workflows/install-check.yml
	file = platform/nextcloud/scripts/package.sh package.sh
	file = platform/nextcloud/scripts/l10n.py scripts/l10n.py
	file = platform/nextcloud/scripts/l10n.sh scripts/l10n.sh
	file = platform/nextcloud/store/appstore.py tests/e2e/store/appstore.py
	file = platform/nextcloud/store/check-install.sh tests/e2e/store/check-install.sh
	record = GUIDELINES/vendor.sources

# What to generate:  output = <target>: <fragment> + <fragment> ...
#
# The target is relative to the project root, the fragments to guidelines.root.
# Repeat the key for more outputs; a fragment may feed more than one -
# project/_CONTRACT.md appears in both, because what binds work in a project
# binds whoever is doing it, agent or not.
[generate]
	output = AGENTS.md: shared/_AGENTS.md + project/_CONTRACT.md
	output = GUIDELINES/README.md: project/_README.md + project/_CONTRACT.md + shared/_README.md
	output = CLAUDE.md: shared/assistants/claude/_CLAUDE.md
